<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusBook Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="overlay.css" />

  <!-- Tasks received via IPC, no Firebase needed here -->
</head>
<body>

  <div id="widget-wrapper" class="widget-wrapper edge-right" title="Click to open tasks">
    <div id="trigger-zone" class="trigger-zone"></div>
    <div id="widget-btn" class="widget-btn">
      <svg id="tab-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <div id="icon-badge" class="icon-badge" style="display:none">0</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       EXPANDED STATE — task panel
       ═══════════════════════════════════════ -->
  <div id="widget-panel" class="widget-panel">
    <!-- Panel drag handle header -->
    <div class="panel-header" id="panel-header">
      <div class="panel-drag-handle">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="panel-flame">
          <path d="M8 2C8 2 11 4.5 11 7C11 8.65 9.65 10 8 10C6.35 10 5 8.65 5 7C5 5.75 5.75 4.35 6.6 3.5C6.6 4.75 7.25 5.15 8 5.15C8 3.75 8 2 8 2Z"
                fill="url(#fg2)"/>
          <defs>
            <linearGradient id="fg2" x1="8" y1="2" x2="8" y2="10" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#FFE566"/>
              <stop offset="100%" stop-color="#FF4500"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="panel-title">FocusBook</span>
      </div>
      <div class="panel-meta">
        <span id="panel-date" class="panel-date"></span>
        <span id="panel-count" class="panel-count"></span>
      </div>
      <button class="panel-close-btn" id="panel-close-btn" title="Collapse">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <line x1="3" y1="7" x2="11" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Status / Auth -->
    <div id="panel-status" class="panel-status">
      <div class="status-spinner" id="status-spinner"></div>
      <span id="panel-status-text">Loading…</span>
      
      <!-- Login Form -->
      <form id="auth-form" class="auth-form" style="display:none">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password" required />
        <button type="submit" id="auth-submit">Log In</button>
        <div style="margin: 6px 0; font-size: 12px; color: rgba(255,255,255,0.3); text-align: center;">OR</div>
        <button type="button" id="auth-google-btn" class="auth-google-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </button>
        <div id="auth-error" class="auth-error"></div>
      </form>
    </div>

    <!-- Progress bar -->
    <div class="panel-progress-wrap" id="panel-progress-wrap" style="display:none">
      <div class="panel-progress-bar">
        <div class="panel-progress-fill" id="panel-progress-fill"></div>
      </div>
      <span class="panel-progress-label" id="panel-progress-label"></span>
    </div>

    <!-- Task list -->
    <div id="task-list" class="task-list"></div>

    <!-- Footer: Add Task -->
    <div class="panel-footer" id="panel-footer" style="display:none">
      <form id="add-task-form" class="add-task-form">
        <!-- Priority selector (shown in normal mode) -->
        <div class="add-priority-selector" id="add-priority-selector">
          <div class="prio-dot high" data-p="high" title="High"></div>
          <div class="prio-dot med" data-p="medium" title="Medium"></div>
          <div class="prio-dot low selected" data-p="low" title="Low"></div>
        </div>
        <!-- Recurring days input (shown in recurring mode) -->
        <div class="add-recurring-selector" id="add-recurring-selector" style="display:none">
          <input type="number" id="recur-days-input" class="recur-days-input" min="1" max="365" value="7" title="Number of days to repeat" />
          <span class="recur-days-label">days</span>
        </div>
        <input type="text" id="add-task-input" placeholder="Add a new task..." autocomplete="off" required />
        <!-- Recurring toggle button -->
        <button type="button" id="recurring-toggle-btn" class="recurring-toggle-btn" title="Toggle Recurring Task">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <path d="M7 22l-4-4 4-4"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
        <button type="submit" class="add-task-btn" title="Add Task">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Light/Dark Theme">☀️</button>
        <button id="logout-btn" class="logout-btn" title="Log Out">Log Out</button>
      </div>
    </div>
  </div>

  <script type="module" src="overlay.js"></script>
</body>
</html>
